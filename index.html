<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>موقع غسان الشخصي</title>
  <style>
    body {
      margin: 0;
      font-family: "Tajawal", sans-serif;
      background-color: #111;
      color: #fff;
      line-height: 1.6;
    }

    /* الهيدر */
    header {
      background: #222;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    header .logo {
      font-size: 20px;
      font-weight: bold;
      color: #fff;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 16px;
      margin: 0;
      padding: 0;
    }

    nav ul li a {
      color: #cfcfcf;
      text-decoration: none;
      font-weight: 600;
    }

    nav ul li a:hover {
      color: #fff;
    }

    /* زر ☰ */
    .menu-toggle {
      font-size: 26px;
      color: #fff;
      cursor: pointer;
      display: none;
    }

    /* زر الإغلاق ✖ */
    .close-btn {
      font-size: 28px;
      color: #fff;
      cursor: pointer;
      position: absolute;
      top: 15px;
      left: 15px;
      display: none;
    }

    /* الموبايل */
    @media (max-width: 768px) {
      nav {
        position: fixed;
        top: 0;
        right: -250px; /* مخفية برا الشاشة */
        width: 250px;
        height: 100%;
        background: #222;
        transition: right 0.3s ease;
        padding-top: 60px;
      }

      nav ul {
        flex-direction: column;
        gap: 20px;
        padding: 0;
        margin: 0;
      }

      nav.show {
        right: 0; /* تظهر القائمة */
      }

      .menu-toggle {
        display: block;
      }

      .close-btn {
        display: block;
      }
    }

    section {
      padding: 60px 20px;
      text-align: center;
    }

    #about img {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      margin-bottom: 20px;
      border: 3px solid #fff;
    }

    #portfolio, #games, #downloads {
      background: #fff;
      color: #000;
      min-height: 250px;
      border-radius: 12px;
      margin: 20px;
      padding: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }

    .grid img, .game-card iframe {
      width: 100%;
      border-radius: 10px;
    }

    #contact form {
      max-width: 400px;
      margin: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    input, textarea, button {
      padding: 10px;
      border-radius: 6px;
      border: none;
      font-size: 16px;
    }

    button {
      background: #444;
      color: #fff;
      cursor: pointer;
    }

    button:hover {
      background: #666;
    }

    footer {
      background: #222;
      padding: 15px;
      text-align: center;
      font-size: 14px;
      margin-top: 40px;
    }

    .footer-info {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .footer-info div {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .footer-info i {
      color: #aaa;
    }

    .socials {
      display: flex;
      justify-content: center;
      gap: 14px;
      font-size: 22px;
    }

    .socials a {
      color: #aaa;
      transition: color 0.3s;
    }

    .socials a:hover {
      color: #fff;
    }

    /* ألعابي */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .game-card {
      background: #fff;
      color: #000;
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.2);
    }

    .game-card h3 {
      margin-bottom: 10px;
    }

    .game-card iframe {
      width: 100%;
      height: 200px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    /* قسم التحميل */
    .download-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 20px;
      align-items: center;
    }

    .download-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f5f5f5;
      padding: 12px 18px;
      border-radius: 10px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .download-item span{font-weight:700}

    .download-btn {
      background: #444;
      color: #fff;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 6px;
      transition: background 0.3s;
    }

    .download-btn:hover {
      background: #666;
    }
  </style>
  <script src="https://kit.fontawesome.com/6c5e6a78b8.js" crossorigin="anonymous"></script>
</head>
<body>

  <header>
    <div class="menu-toggle" onclick="toggleMenu()">☰</div>
    <div class="logo">موقع غسان الشخصي</div>
    <nav id="nav">
      <div class="close-btn" onclick="toggleMenu()">✖</div>
      <ul>
        <li><a href="#about" onclick="toggleMenu()">من أنا</a></li>
        <li><a href="#portfolio" onclick="toggleMenu()">أعمالي</a></li>
        <li><a href="#games" onclick="toggleMenu()">ألعابي</a></li>
        <li><a href="#downloads" onclick="toggleMenu()">الروابط التحميل</a></li>
        <li><a href="#contact" onclick="toggleMenu()">تواصل</a></li>
      </ul>
    </nav>
  </header>

  <!-- باقي أقسام الموقع زي ما هي ... -->

  <footer>
    <div class="footer-info">
      <div><i class="fas fa-map-marker-alt"></i> اليمن</div>
      <div><i class="fas fa-envelope"></i> ghassan515253@gmail.com</div>
      <div><i class="fas fa-phone"></i> +967-781324733</div>
    </div>
    <div class="socials">
      <a href="https://facebook.com" target="_blank"><i class="fab fa-facebook"></i></a>
      <a href="https://instagram.com" target="_blank"><i class="fab fa-instagram"></i></a>
      <a href="https://youtube.com" target="_blank"><i class="fab fa-youtube"></i></a>
    </div>
    <p>© <span id="year"></span> جميع الحقوق محفوظة</p>
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
    function toggleMenu() {
      document.getElementById("nav").classList.toggle("show");
    }
  </script>

</body>
</html>
